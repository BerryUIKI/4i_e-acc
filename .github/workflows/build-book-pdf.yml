name: Build Book PDF

# Auto-compile 《四倍做多认知，长期做多人生》 to PDF on every push
# to the book branch. Uses Pandoc + XeLaTeX with DollarHua brand styling.
#
# Architecture:
#   1. Merge book chapters via build_pdf.py tex (generate .tex only)
#   2. Install Source Han Serif/Sans SC OTF fonts from Adobe releases
#   3. XeLaTeX 2-pass compilation
#   4. Upload PDF artifact (90-day retention)

on:
  push:
    branches:
      - article/2026-quadruple-long-life
      - article/2026-quadruple-long-life-polish
    paths:
      - 'articles/2026-quadruple-long-life/**/*.md'
      - 'skills/pdf-toolbook/**'
      - '.github/workflows/build-book-pdf.yml'
  pull_request:
    paths:
      - 'skills/pdf-toolbook/**'
      - '.github/workflows/build-book-pdf.yml'
  workflow_dispatch:  # manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # ── System dependencies ──────────────────────────
      - name: Install texlive + pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-lang-chinese \
            texlive-fonts-recommended \
            pandoc \
            python3 \
            unzip \
            poppler-utils

      # ── Install Source Han fonts from Adobe releases ──
      - name: Install Source Han fonts (Serif + Sans SC)
        run: |
          mkdir -p ~/.fonts
          # Source Han Serif SC v2.003R Language Specific OTFs — 宋体风格，正文用
          curl -sSL -o /tmp/SourceHanSerifSC.zip \
            "https://github.com/adobe-fonts/source-han-serif/releases/download/2.003R/09_SourceHanSerifSC.zip"
          unzip -qo /tmp/SourceHanSerifSC.zip -d /tmp/serif-fonts/
          find /tmp/serif-fonts -name "*.otf" -exec cp {} ~/.fonts/ \;

          # Source Han Sans SC v2.005R Language Specific OTFs — 黑体风格，标题用
          curl -sSL -o /tmp/SourceHanSansSC.zip \
            "https://github.com/adobe-fonts/source-han-sans/releases/download/2.005R/09_SourceHanSansSC.zip"
          unzip -qo /tmp/SourceHanSansSC.zip -d /tmp/sans-fonts/
          find /tmp/sans-fonts -name "*.otf" -exec cp {} ~/.fonts/ \;

          fc-cache -fv
          echo "Source Han fonts installed:"
          fc-list | grep -i "source han" | wc -l

      - name: Verify dependencies
        run: |
          echo "xelatex: $(xelatex --version 2>&1 | head -1)"
          echo "pandoc:  $(pandoc --version 2>&1 | head -1)"
          echo "Source Han fonts:"
          fc-list | grep -i "source han" | head -10

      # ── Generate .tex (no compilation yet) ───────────
      - name: Generate LaTeX source
        run: |
          cd skills/pdf-toolbook
          python3 scripts/build_pdf.py tex ../../book-task.md \
            "$(pwd)/output/toolbook.tex"

      - name: Verify CJK content preserved
        run: |
          echo "=== Merged MD CJK check ==="
          CJK_MD=$(python3 -c "
          with open('output/_merged.md','r') as f: t=f.read()
          print(len([c for c in t if '\u4e00'<=c<='\u9fff']))")
          echo "CJK chars in _merged.md: $CJK_MD"

          echo ""
          echo "=== Generated .tex CJK check ==="
          CJK_TEX=$(python3 -c "
          with open('skills/pdf-toolbook/output/toolbook.tex','r') as f: t=f.read()
          print(len([c for c in t if '\u4e00'<=c<='\u9fff']))")
          echo "CJK chars in .tex: $CJK_TEX"

          if [ "$CJK_TEX" -lt 10000 ]; then
            echo "ERROR: .tex has < 10K CJK chars — emoji fix may not be working!"
            head -50 output/_merged.md
            exit 1
          fi
          echo "SUCCESS: CJK text preserved"

      # ── XeLaTeX 3-pass compilation ──────────────────
      - name: Compile PDF (xelatex × 3)
        run: |
          cd skills/pdf-toolbook/output
          # Locate main tex file (split → tex/main.tex, monolithic → toolbook.tex)
          if [ -f "tex/main.tex" ]; then
            MAIN="tex/main.tex"
            TEX_DIR="tex"
          else
            MAIN="toolbook.tex"
            TEX_DIR="."
          fi
          echo "Main tex: $MAIN"
          # Pass 1: generate .aux / .toc (warnings OK, don't halt)
          xelatex -interaction=nonstopmode -output-directory="$TEX_DIR" "$MAIN" || true
          # Pass 2: resolve TOC + cross-refs (warnings OK, longtable needs another pass)
          xelatex -interaction=nonstopmode -output-directory="$TEX_DIR" "$MAIN" || true
          # Pass 3: final — longtable widths stable, fail on real errors
          xelatex -interaction=nonstopmode -halt-on-error -output-directory="$TEX_DIR" "$MAIN"

      # ── Verify PDF font embedding ──────────────────
      - name: Verify CJK font embedding
        run: |
          cd skills/pdf-toolbook/output
          PDF=$(find . -name "*.pdf" | head -1)
          echo "PDF: $PDF ($(du -h "$PDF" | cut -f1))"
          echo ""
          echo "=== All embedded fonts (pdffonts) ==="
          pdffonts "$PDF" || true
          echo ""
          # Core check: Source Han CJK fonts must be embedded
          if ! pdffonts "$PDF" 2>/dev/null | grep -iq "SourceHan"; then
            echo ""
            echo "ERROR: No Source Han CJK fonts embedded in PDF!"
            echo "Falling back to binary search..."
            grep -aob "SourceHan" "$PDF" | head -5 || echo "  (no binary match either)"
            exit 1
          fi
          echo ""
          echo "SUCCESS: Source Han CJK fonts confirmed embedded"

      # ── Upload artifact ─────────────────────────────
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: quadruple-long-life
          path: skills/pdf-toolbook/output/**/*.pdf
          retention-days: 90

      # ── Auto-commit PDF to repository ───────────────
      - name: Commit PDF to repo
        if: success()
        run: |
          cp skills/pdf-toolbook/output/toolbook.pdf articles/2026-quadruple-long-life/output/book.pdf
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles/2026-quadruple-long-life/output/book.pdf
          git diff --staged --quiet || git commit -m "[CI] Auto-build PDF $(date +'%Y-%m-%d')"
          git push
