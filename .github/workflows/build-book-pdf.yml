name: Build Book PDF

# Auto-compile 《四倍做多认知，长期做多人生》 to PDF on every push
# to the book branch AND on main (so the PDF is rebuilt automatically
# after any PR merge into main). Uses Pandoc + XeLaTeX with DollarHua styling.
#
# Architecture:
#   1. Install Source Han Serif/Sans SC OTF fonts from Adobe releases
#   2. Merge book chapters + generate .tex via build_pdf.py tex
#   3. XeLaTeX 3-pass compilation (intermediates in output/build/, deliverables in output/pdf/)
#   4. Verify CJK font embedding, upload PDF artifact (90-day retention)
#   5. On main: automatically publish PDF to GitHub Releases (v0.x).
#      PDF binaries are never committed to the git repo tree.

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'articles/2026-quadruple-long-life/**/*.md'
      - 'skills/pdf-toolbook/**'
      - '.github/workflows/build-book-pdf.yml'
  pull_request:
    paths:
      - 'articles/2026-quadruple-long-life/**/*.md'
      - 'skills/pdf-toolbook/**'
      - '.github/workflows/build-book-pdf.yml'
  workflow_dispatch:  # manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true   # cover illustration (00-cover.png) is an LFS asset

      # ── System dependencies ──────────────────────────
      - name: Install texlive + pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-lang-chinese \
            texlive-fonts-recommended \
            pandoc \
            python3 \
            unzip \
            poppler-utils

      # ── Install Source Han fonts from Adobe releases ──
      - name: Install Source Han fonts (Serif + Sans SC)
        run: |
          mkdir -p ~/.fonts
          # Source Han Serif SC v2.003R Language Specific OTFs — 宋体风格，正文用
          curl -sSL -o /tmp/SourceHanSerifSC.zip \
            "https://github.com/adobe-fonts/source-han-serif/releases/download/2.003R/09_SourceHanSerifSC.zip"
          unzip -qo /tmp/SourceHanSerifSC.zip -d /tmp/serif-fonts/
          find /tmp/serif-fonts -name "*.otf" -exec cp {} ~/.fonts/ \;

          # Source Han Sans SC v2.005R Language Specific OTFs — 黑体风格，标题用
          curl -sSL -o /tmp/SourceHanSansSC.zip \
            "https://github.com/adobe-fonts/source-han-sans/releases/download/2.005R/09_SourceHanSansSC.zip"
          unzip -qo /tmp/SourceHanSansSC.zip -d /tmp/sans-fonts/
          find /tmp/sans-fonts -name "*.otf" -exec cp {} ~/.fonts/ \;

          fc-cache -fv
          echo "Source Han fonts installed:"
          fc-list | grep -i "source han" | wc -l

      - name: Verify dependencies
        run: |
          echo "xelatex: $(xelatex --version 2>&1 | head -1)"
          echo "pandoc:  $(pandoc --version 2>&1 | head -1)"
          echo "Source Han fonts:"
          fc-list | grep -i "source han" | head -10

      # The PDF is the only deliverable; all intermediate files stay in build/.
      - name: Build PDF (xelatex × 3)
        run: |
          python3 skills/pdf-toolbook/scripts/test_build_pdf.py
          python3 skills/pdf-toolbook/scripts/build_pdf.py build book-task.md

      - name: Verify CJK content preserved
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('merged.md', 'quadruple-long-life.tex'):
              text = (Path('output/build/quadruple-long-life') / name).read_text()
              count = sum('\u4e00' <= c <= '\u9fff' for c in text)
              assert count >= 10000, (name, count)
              print(name, count)
          PY

      # ── Verify PDF font embedding ──────────────────
      - name: Verify CJK font embedding
        run: |
          PDF=output/pdf/quadruple-long-life.pdf
          echo "PDF: $PDF ($(du -h "$PDF" | cut -f1))"
          echo ""
          echo "=== All embedded fonts (pdffonts) ==="
          pdffonts "$PDF" || true
          echo ""
          # Core check: Source Han CJK fonts must be embedded
          if ! pdffonts "$PDF" 2>/dev/null | grep -iq "SourceHan"; then
            echo ""
            echo "ERROR: No Source Han CJK fonts embedded in PDF!"
            echo "Falling back to binary search..."
            grep -aob "SourceHan" "$PDF" | head -5 || echo "  (no binary match either)"
            exit 1
          fi
          echo ""
          echo "SUCCESS: Source Han CJK fonts confirmed embedded"

      # ── Upload artifact ─────────────────────────────
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: quadruple-long-life
          path: output/pdf/quadruple-long-life.pdf
          retention-days: 90

      # ── Publish PDF to GitHub Releases (main only) ──
      - name: Publish PDF to GitHub Releases
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PDF=output/pdf/quadruple-long-life.pdf
          test -s "$PDF"
          cp "$PDF" quadruple-long-life.pdf
          # Versioning: start at v0.1, bump patch number while the tag exists
          major=0; minor=1
          while gh release view "v${major}.${minor}" >/dev/null 2>&1; do
            minor=$((minor+1))
          done
          tag="v${major}.${minor}"
          gh release create "$tag" quadruple-long-life.pdf \
            --title "Quadruple Long Life ${tag}" \
            --notes "Auto-built PDF of 《四倍做多认知，长期做多人生》 (Quadruple Long Life). Generated $(date -u +'%Y-%m-%d %H:%M UTC')."

