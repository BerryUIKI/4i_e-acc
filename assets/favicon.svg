<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D373"/>
      <stop offset="50%" stop-color="#E3A04B"/>
      <stop offset="100%" stop-color="#B86C40"/>
    </linearGradient>
    <linearGradient id="earPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEC6CD"/>
      <stop offset="100%" stop-color="#F3A6AF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1D1E50" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Cat ears for DollarHua -->
  <path d="M 15 28 L 8 8 Q 16 12 25 18 Z" fill="#FFFFFF" stroke="#1D1E50" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 14 24 L 11 12 Q 16 15 21 19 Z" fill="url(#earPink)"/>

  <path d="M 49 28 L 56 8 Q 48 12 39 18 Z" fill="#FFFFFF" stroke="#1D1E50" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 50 24 L 53 12 Q 48 15 43 19 Z" fill="url(#earPink)"/>

  <!-- Bronze / Gold Coin Body -->
  <circle cx="32" cy="38" r="23" fill="url(#coinGrad)" stroke="#1D1E50" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="32" cy="38" r="19" fill="none" stroke="#FFF7E6" stroke-width="1.2" opacity="0.6"/>

  <!-- Inner square hole of the coin -->
  <rect x="25" y="31" width="14" height="14" rx="2" fill="#FBF7F0" stroke="#1D1E50" stroke-width="2.5"/>

  <!-- 4 marks for coin -->
  <circle cx="32" cy="22" r="2" fill="#1D1E50"/>
  <circle cx="32" cy="54" r="2" fill="#1D1E50"/>
  <circle cx="16" cy="38" r="2" fill="#1D1E50"/>
  <circle cx="48" cy="38" r="2" fill="#1D1E50"/>
</svg>
