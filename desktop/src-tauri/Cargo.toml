[package]
name = "quadruple-toolbox"
version = "0.1.0"
description = "Quadruple Leverage Toolbox — desktop companion (Tauri 2 + Rust)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "quadruple_toolbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
