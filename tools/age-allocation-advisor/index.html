<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1D1E50">
<title>人生阶段复核 · Allocation Advisor</title>
<style>
  :root{--cream:#FBF7F0;--paper:#FFF;--pink:#FEC6CD;--pink-deep:#F3A6AF;--navy:#1D1E50;--bronze:#B86C40;--teal:#0F6E56;--red:#A32D2D;--ink:#2C2C2A;--line:#E7E0D4;--muted:#6b675e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.6;padding:24px 16px 40px}
  .wrap{max-width:960px;margin:0 auto}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  header h1{font-size:22px;font-weight:700;color:var(--navy)} header .sub{font-size:13px;color:var(--muted);flex:1}
  .langbtn{border:1px solid var(--pink-deep);background:#fff;color:var(--navy);font-size:12px;padding:4px 10px;border-radius:999px;cursor:pointer}
  .disclaimer{font-size:12px;color:var(--muted);margin:6px 0 16px}
  .grid{display:grid;grid-template-columns:330px 1fr;gap:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  .card h2{font-size:14px;color:var(--navy);margin-bottom:12px;font-weight:600}
  .q{margin-bottom:12px}
  .q .ql{font-size:13px;margin-bottom:5px}
  .q select,.q input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
  .btn{width:100%;padding:11px;border:none;border-radius:10px;background:var(--navy);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:center}
  th{color:var(--muted);font-weight:500} td.hl{background:#FDF0DC}
  tr.cur td{background:#E1F5EE;font-weight:600}
  .note{font-size:12px;color:var(--muted);margin-top:8px}
  .warnbox{background:#FCEBEB;border-left:4px solid var(--red);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px}
  .warnbox b{color:var(--red)}
  .okbox{background:#EAF3DE;border-left:4px solid #639922;border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px}
  footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
<header><div class="nav-bar" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;width:100%;font-size:12px">
    <a class="nav-home" href="../../index.html" style="color:var(--muted);text-decoration:none;background:#FFFDF8;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-weight:500">🏠 <span data-i18n="navHome">首页</span></a>
    <a class="nav-tools" href="../index.html" style="color:var(--bronze);text-decoration:none;background:#FFFDF8;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-weight:600">🧰 <span data-i18n="navTools">工具箱</span></a>
    <select class="tool-select" onchange="if(this.value)location.href=this.value" aria-label="Switch tool" style="border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:11.5px;background:#FFFDF8;color:var(--navy);cursor:pointer;font-family:inherit">
      <optgroup label="A · 数字工具箱">
        <option value="../compound-calculator/index.html">A1 复利计算器 · Compound Calculator</option>
        <option value="../dca-simulator/index.html">A2 定投模拟器 · DCA Simulator</option>
        <option value="../etf-premium-calculator/index.html">A3 ETF 溢价率速算 · Premium Calculator</option>
        <option value="../fee-erosion-calculator/index.html">A4 费率侵蚀对比器 · Fee Erosion</option>
        <option value="../age-allocation-advisor/index.html" selected>A5 人生阶段复核 · Allocation Advisor</option>
        <option value="../five-year-rule-checker/index.html">A6 五年规则检查器 · 5-Year Rule</option>
      </optgroup>
      <optgroup label="B · AI 财务副驾驶">
        <option value="../ai-accounting-pack/index.html">B1 AI 记账对话包 · Prompt Pack</option>
        <option value="../goal-translator/index.html">B2 人生目标翻译器 · Goal Translator</option>
        <option value="../review-generator/index.html">B3 投资复盘生成器 · Review Generator</option>
        <option value="../ai-redline-cards/index.html">B4 AI 投资红线卡 · Red-Line Cards</option>
      </optgroup>
    </select>
  </div><h1 data-i18n="title">人生阶段复核</h1><span class="sub" data-i18n="subtitle">源自《四倍做多认知，长期做多人生》第二十二章 + 附录 J</span><button class="langbtn" id="langbtn" onclick="toggleLang()">English</button></header>
<p class="disclaimer" data-i18n="disclaimer">教学参考工具：区间为一般参考，非个性化投资建议；有疑问请咨询专业人士。</p>
<div class="grid">
  <div class="card">
    <h2 data-i18n="qTitle">几个问题</h2>
    <div class="q"><div class="ql" data-i18n="qAge">你的年龄段</div>
      <select id="age"><option value="1" data-i18n="a1">20–30 岁</option><option value="2" data-i18n="a2">30–40 岁</option><option value="3" data-i18n="a3">40–50 岁</option><option value="4" data-i18n="a4">50–60 岁</option><option value="5" data-i18n="a5">60 岁以上</option></select></div>
    <div class="q"><div class="ql" data-i18n="qEF">应急资金（3–6 个月支出）是否已备齐？</div>
      <select id="ef"><option value="ok" data-i18n="efOk">已备齐</option><option value="no" data-i18n="efNo">还没备齐</option></select></div>
    <div class="q"><div class="ql" data-i18n="qBig">近期（≤5 年）是否有明确要动用的大额资金（购房首付/换房等）？</div>
      <select id="big"><option value="no" data-i18n="bigNo">没有</option><option value="2y" data-i18n="big2y">两年内要用</option><option value="5y" data-i18n="big5y">三到五年内要用</option></select></div>
    <div class="q"><div class="ql" data-i18n="qInc">收入稳定吗？（创业/提成制波动大？）</div>
      <select id="inc"><option value="ok" data-i18n="incOk">比较稳定</option><option value="vol" data-i18n="incVol">波动较大</option></select></div>
    <div class="q"><div class="ql" data-i18n="qPen">退休后保障强吗？（如体制内养老金可覆盖生活）</div>
      <select id="pen"><option value="no" data-i18n="penNo">一般/靠自己</option><option value="yes" data-i18n="penYes">保障很强</option></select></div>
    <button class="btn" onclick="run()" data-i18n="btnRun">生成参考</button>
  </div>
  <div class="card">
    <h2 data-i18n="rTitle">参考区间（%）</h2>
    <table id="tbl"></table>
    <div id="advice"></div>
    <div class="note" data-i18n="note">区间来自附录 J；「不适用情形」与调整方向来自第二十二章各阶段。权益类指宽基股票 ETF；债券类含利率债/货基替代；比例合计约 100%。</div>
  </div>
</div>
<footer><div id="foot"></div></footer>
</div>
<script>
const STAGES={zh:["职业与收入是否稳定，储备和近期用途是否安排？","共同支出、个人资产、照护与债务怎样划分？","教育、赡养和养老是否竞争同一笔资金？","养老金覆盖多少支出，如何应对早期提款与下跌？","医疗与生活缺口如何变化，缓冲与传承怎样复核？"],en:["Check employment, reserves and near-term uses.","Separate shared expenses, personal assets, care and debts.","Check education, care and retirement funding conflicts.","Review pension coverage and early withdrawal risk.","Review spending, healthcare, buffer funding and succession."]};
const I18N={zh:{back:"← 返回工具箱",title:"人生阶段复核",subtitle:"源自《四倍做多认知，长期做多人生》第二十二章 + 附录 J",disclaimer:"按第八章检查约束，再结合人生阶段复核目标。本工具不按年龄生成投资比例。",
qTitle:"几个问题",qAge:"你的年龄段",a1:"20–30 岁",a2:"30–40 岁",a3:"40–50 岁",a4:"50–60 岁",a5:"60 岁以上",
qEF:"必要应急储备是否按家庭情况备齐？",efOk:"已备齐",efNo:"还没备齐",
qBig:"近期（≤5 年）是否有明确要动用的大额资金（购房首付/换房等）？",bigNo:"没有",big2y:"两年内要用",big5y:"三到五年内要用",
qInc:"收入稳定吗？（创业/提成制波动大？）",incOk:"比较稳定",incVol:"波动较大",
qPen:"退休后保障强吗？（如体制内养老金可覆盖生活）",penNo:"一般/靠自己",penYes:"保障很强",btnRun:"整理复核事项",
rTitle:"当前阶段要复核的问题",hStage:"阶段",hEquity:"权益类",hBond:"债券类",hGold:"黄金/另类",hCash:"现金",
cur:"← 你的阶段",
warnEF:"先确定并补足必要储备，核对工具风险与到账条件。",
warnBig2:"单列两年内的必要支出，不把它当长期账户。",
warnBig5:"单列三至五年的目标，核对金额刚性与到期安排。",
warnVol:"按收入中断情景复核支出、储备与持续投入能力。",
boostPen:"核对养老金实际可覆盖的支出；保障充足也不自动要求更高权益。",
okBox:"这些基本项已有安排，仍需检查目标金额、损失承受与产品条件。",
note:"来源：第二十二章与附录 J，2026-11-05 修订。年龄只是提示；任何重要约束都不能被其他答案抵消。",
foot:"本地自查工具，无计分配比。依据书中第八、二十二章与附录 C/J；教育用途。"},
en:{back:"← Toolbox",title:"Life-stage Review",subtitle:"from Ch22 + Appendix J of Quadruple Leverage",disclaimer:"Review financial constraints before life-stage goals. This tool does not generate age-based allocations.",
qTitle:"A few questions",qAge:"Your age band",a1:"20–30",a2:"30–40",a3:"40–50",a4:"50–60",a5:"60+",
qEF:"Are reserves sufficient for your actual obligations?",efOk:"Yes",efNo:"Not yet",
qBig:"Large near-term spending (≤5 yrs: home down payment etc.)?",bigNo:"None",big2y:"Within 2 years",big5y:"Within 3–5 years",
qInc:"Is your income stable? (startup/commission = volatile)",incOk:"Fairly stable",incVol:"Volatile",
qPen:"Strong pension coverage after retirement?",penNo:"Average / self-funded",penYes:"Strong",btnRun:"Review constraints",
rTitle:"Questions for this life stage",hStage:"Stage",hEquity:"Equity",hBond:"Bonds",hGold:"Gold/Alt",hCash:"Cash",
cur:"← your stage",
warnEF:"Define and fund reserves; check instrument risk and access.",
warnBig2:"Separate necessary spending within two years from long-term funds.",
warnBig5:"Separate three-to-five-year goals and check timing and loss constraints.",
warnVol:"Stress-test expenses, reserves and contributions against interrupted income.",
boostPen:"Verify actual pension coverage; stronger coverage does not require more equity.",
okBox:"Basics are arranged; still review target funding, loss capacity and product constraints.",
note:"Source: Ch22 and Appendix J, revised 2026-11-05. Age is a prompt; constraints cannot be offset by other answers.",
foot:"Local non-scoring self-check based on Ch8/Ch22 and Appendix C/J; educational use."}};
let LANG="zh";function t(k,v){let s=I18N[LANG][k]||I18N.zh[k];if(v)for(const x in v)s=s.replace("{"+x+"}",v[x]);return s;}
function toggleLang(){LANG=LANG==="zh"?"en":"zh";applyLang();}
function applyLang(){document.documentElement.lang=LANG==="zh"?"zh-CN":"en";document.getElementById("langbtn").textContent=LANG==="zh"?"English":"中文";
document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n);});
run();document.getElementById("foot").innerHTML=t("foot");}
function run(){
  const age=Math.min(5,Math.max(1,+document.getElementById("age").value||1));
  const fields=[['ef','no','warnEF'],['big','2y','warnBig2'],['big','5y','warnBig5'],['inc','vol','warnVol'],['pen','yes','boostPen']];
  document.getElementById("tbl").innerHTML=`<tr><th>${t('hStage')}</th><th>${t('rTitle')}</th></tr><tr><td>${t('a'+age)}</td><td>${STAGES[LANG][age-1]}</td></tr>`;
  const messages=fields.filter(([id,value])=>document.getElementById(id).value===value).map(([, ,key])=>t(key));
  if(!messages.length)messages.push(t('okBox'));
  document.getElementById('advice').innerHTML=messages.map(message=>`<div class="warnbox">${message}</div>`).join('');
}
applyLang();
</script>
<script>
// Universal Web & Desktop Export + Toast
(function(){
  var b=document.createElement("button");
  b.className="export-fab-btn";
  b.innerHTML='<span style="margin-right:4px">📥</span>'+(window.LANG==="zh"?"导出结果 / Export":"Export");
  b.style.cssText="position:fixed;right:16px;bottom:14px;z-index:9999;border:none;border-radius:10px;background:#1D1E50;color:#fff;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit;box-shadow:0 3px 12px rgba(29,30,80,0.25);transition:all .15s";
  b.onmouseenter=function(){b.style.transform="translateY(-1px)";b.style.boxShadow="0 5px 16px rgba(29,30,80,0.35)";};
  b.onmouseleave=function(){b.style.transform="none";b.style.boxShadow="0 3px 12px rgba(29,30,80,0.25)";};
  document.body.appendChild(b);

  function showToast(msg){
    var t=document.getElementById("tool-toast");
    if(!t){
      t=document.createElement("div");
      t.id="tool-toast";
      t.style.cssText="position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:10000;background:#1D1E50;color:#FFF;padding:8px 18px;border-radius:999px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,0.25);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap";
      document.body.appendChild(t);
    }
    t.textContent=msg;
    t.style.opacity="1";
    t.style.transform="translateX(-50%) translateY(0)";
    clearTimeout(t._timer);
    t._timer=setTimeout(function(){
      t.style.opacity="0";
      t.style.transform="translateX(-50%) translateY(6px)";
    },2400);
  }

  b.addEventListener("click",function(){
    var lines=[document.title,""];
    lines.push("--- INPUTS ---");
    document.querySelectorAll("input,select,textarea").forEach(function(inp){
      if(inp.type==="button"||inp.type==="submit") return;
      var lab=(inp.labels&&inp.labels[0])?inp.labels[0].textContent.trim()+" = ":"";
      if(!lab&&inp.id){var l=document.querySelector('label[for="'+inp.id+'"]');if(l)lab=l.textContent.trim()+" = ";}
      lines.push((lab||"")+inp.value);
    });
    lines.push("");lines.push("--- RESULT ---");
    document.querySelectorAll(".metric,.verdict,.diff,.big,.out,.res,#res,#output").forEach(function(el){
      var txt=el.textContent.trim().replace(/\s+/g," ");
      if(txt) lines.push(txt);
    });
    var content=lines.join("\n");
    var safeTitle=(document.title.split("·")[0]||document.title).trim().replace(/[^a-zA-Z0-9\u4e00-\u9fa5]+/g,"-").replace(/^-|-$/g,"")||"tool";
    var name=safeTitle+"-result.txt";

    if(window.__TAURI__){
      window.__TAURI__.core.invoke("export_result",{content:content,defaultName:name})
        .then(function(res){
          if(res!=="cancelled") showToast((window.LANG==="zh"?"已保存至: ":"Saved to: ")+res);
        })
        .catch(function(e){window.alert("Export failed: "+e);});
    }else{
      var blob=new Blob([content],{type:"text/plain;charset=utf-8"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      a.href=url;
      a.download=name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(window.LANG==="zh"?"已下载计算结果文本":"Result file downloaded");
    }
  });
})();
</script>
<script>
// LocalStorage Persistence + Reactive Input Calculation + Reset
(function(){
  if(typeof localStorage==="undefined") return;
  var KEY="ql-toolbox:"+location.pathname.replace(/[^a-z0-9]+/gi,"-");
  function getDefaults(){
    var o={};
    document.querySelectorAll("input,select,textarea").forEach(function(el){
      if(el.id && el.defaultValue!==undefined) o[el.id]=el.defaultValue;
    });
    return o;
  }
  var defaults=getDefaults();

  window.resetDefaults=function(){
    localStorage.removeItem(KEY);
    Object.keys(defaults).forEach(function(id){
      var el=document.getElementById(id);
      if(el) el.value=defaults[id];
    });
    var fn=window.calc||window.run||window.gen||null;
    if(fn) fn();
    var t=document.getElementById("tool-toast");
    if(t){
      t.textContent=window.LANG==="zh"?"已恢复默认参数":"Defaults restored";
      t.style.opacity="1";
      setTimeout(function(){t.style.opacity="0";},2000);
    }
  };

  function loadVals(){
    var raw=localStorage.getItem(KEY); if(!raw) return;
    try{ var o=JSON.parse(raw);
      Object.keys(o).forEach(function(id){ var el=document.getElementById(id); if(el) el.value=o[id]; });
      var fn=window.calc||window.run||window.gen||null; if(fn) fn();
    }catch(e){}
  }
  function saveVals(){ var o={};
    document.querySelectorAll("input,select,textarea").forEach(function(el){ if(el.id) o[el.id]=el.value; });
    try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){}
    var fn=window.calc||window.run||window.gen||null; if(fn) fn();
  }
  document.addEventListener("input",saveVals);
  document.addEventListener("change",saveVals);
  loadVals();
})();
</script>
</body>
