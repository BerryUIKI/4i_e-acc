<style>
  :root{--cream:#FBF7F0;--paper:#FFF;--pink:#FEC6CD;--pink-deep:#F3A6AF;--navy:#1D1E50;--bronze:#B86C40;--teal:#0F6E56;--ink:#2C2C2A;--line:#E7E0D4;--muted:#6b675e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.7;padding:24px 16px 48px}
  .wrap{max-width:860px;margin:0 auto}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  header h1{font-size:22px;font-weight:700;color:var(--navy)} header .sub{font-size:13px;color:var(--muted);flex:1}
  .langbtn{border:1px solid var(--pink-deep);background:#fff;color:var(--navy);font-size:12px;padding:4px 10px;border-radius:999px;cursor:pointer}
  .intro{font-size:13px;color:var(--muted);margin:8px 0 18px;max-width:78ch}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}
  .card h2{font-size:15px;color:var(--navy);margin-bottom:4px;font-weight:600}
  .meta{font-size:12px;color:var(--muted);margin-bottom:10px}
  .prompt{background:#FDF9F3;border:1px solid var(--line);border-left:4px solid var(--pink-deep);border-radius:8px;padding:12px 14px;font-size:13.5px;white-space:pre-wrap;margin-bottom:10px}
  .copy{display:inline-block;border:1px solid var(--navy);background:#fff;color:var(--navy);font-size:12.5px;padding:5px 14px;border-radius:8px;cursor:pointer}
  .copy:hover{background:var(--navy);color:#fff}
  .ok{font-size:12px;color:var(--teal);margin-left:8px;opacity:0;transition:opacity .3s}
  .ok.show{opacity:1}
  footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
  .note{font-size:12.5px;background:#FDF6EE;border-left:4px solid var(--bronze);border-radius:8px;padding:10px 12px;margin-bottom:16px}

  </div><h1 data-i18n="title">AI 记账对话包</h1><span class="sub" data-i18n="subtitle">源自《四倍做多认知，长期做多人生》第三十一章 · 蓝鲸记账配套</span>
<button class="langbtn" id="langbtn" onclick="toggleLang()">English</button></header>
<p class="intro" data-i18n="intro">把第三十一章的记账原则固化成可直接粘贴给任何对话式 AI（或蓝鲸记账内置助手）的指令。原则：AI 管分类与汇总、不替你评价消费；你的账单数据只给可信工具。</p>
<div class="note" data-i18n="note">用法：复制一条 prompt，粘贴到你的 AI 助手；之后把当月收支逐条发过去即可。隐私提示：只发送必要的金额与类别，不要包含卡号等敏感信息。</p>
<div id="cards"></div>
<footer><div id="foot"></div></footer>
</div>
<script>
const PACKS=[
 {id:"bookkeeper",zh:{back:"← 返回工具箱",t:"① 记账员 · 分类与汇总",use:"每日/每周把收支发给它，让它归类",p:"你是一位严谨的记账助手。规则：1) 把用户发来的每笔收支归类到：餐饮/住房/交通/购物/娱乐/医疗/教育/保险/人情/其他；2) 每笔只回答归类与一句话理由；3) 不做道德评价，不批评消费；4) 每周五输出本周汇总：总收入、总支出、最大三项支出、储蓄率（结余÷收入）；5) 发现疑似重复记账时提醒我核对。"},
en:{back:"← Toolbox",t:"① Bookkeeper · categorize & summarize",use:"Feed it daily/weekly transactions to sort",p:"You are a meticulous bookkeeping assistant. Rules: 1) classify every transaction into: food/housing/transport/shopping/entertainment/medical/education/insurance/gifts/other; 2) reply with the category and a one-line reason; 3) never moralize or judge spending; 4) every Friday output a weekly summary: total income, total spending, top-3 expenses, savings rate (balance ÷ income); 5) flag possible duplicates for me to verify."}},
 {id:"monthly",zh:{t:"② 月末回顾 · 找模式不找借口",use:"月末给它整个月的分类汇总",p:"你是一位财务复盘伙伴。基于我提供的本月收支汇总：1) 指出支出占比最高的三个类别，并和上月对比；2) 识别固定支出与可选支出，标出「可选支出中波动最大」的项；3) 不要给出「应该砍掉××」的指令式建议，而是用问题引导我自己想（例如：你觉得这个月的餐饮和上月比怎么样？）；4) 结尾给一句中性总结，不评判我。"},
en:{t:"② Month-end review · find patterns, not excuses",use:"Give it the month's category summary at month-end",p:"You are a financial review partner. Given my month's categorized summary: 1) name the top-3 spending categories and compare to last month; 2) separate fixed vs discretionary spending, flag the most volatile discretionary item; 3) do not give imperative advice ('cut X'); instead ask questions that make me think (e.g. how does this month's food spending compare to last month?); 4) end with a neutral summary without judgment."}},
 {id:"cashflow",zh:{t:"③ 现金流医生 · 结余与储蓄率",use:"给它几个月流水，算真实储蓄率",p:"你是一位现金流分析助手。给我提供的 N 个月收支数据：1) 逐月计算储蓄率 =（收入-支出）÷ 收入；2) 指出储蓄率趋势与异常月份；3) 若某月为负结余，列出是哪些类别导致；4) 结合书中「先储蓄后消费」思路，提示我结余是否该在发薪日先自动划走，但不替我决定金额。"},
en:{t:"③ Cashflow doctor · balance & savings rate",use:"Give it several months of flows for real savings rate",p:"You are a cashflow analyst. For the N months of data I give you: 1) compute monthly savings rate = (income − spending) ÷ income; 2) point out the trend and outlier months; 3) if a month was negative, show which categories caused it; 4) in the spirit of 'pay yourself first', suggest I auto-transfer savings on payday — but never decide the amount for me."}},
 {id:"boundary",zh:{t:"④ 边界守护 · 隐私与决定权",use:"每次会话开始时可用",p:"你是一位记账助手。边界规则：1) 不询问也不存储我的银行卡号、密码、身份证等敏感信息；2) 我可以随时要求你忘记本会话的数据；3) 你的职责是分类、汇总、回顾与提问引导，绝不替我做「该不该花」的决定，也不预测我的未来财务；4) 若我让你做的事超出记账范畴（如荐股、投资操作），礼貌拒绝并提醒我回到记账。"},
en:{t:"④ Boundary guard · privacy & decision rights",use:"Useful at the start of every session",p:"You are a bookkeeping assistant. Boundary rules: 1) never ask for or store my card numbers, passwords, ID etc.; 2) I can ask you to forget this session's data at any time; 3) your job is classifying, summarizing, reviewing and asking questions — never deciding what I 'should' spend on, never forecasting my finances; 4) if I ask for something beyond bookkeeping (stock tips, trades), decline politely and bring me back to bookkeeping."}}
];
const I18N={zh:{title:"AI 记账对话包",subtitle:"源自《四倍做多认知，长期做多人生》第三十一章 · 蓝鲸记账配套",
intro:"把第三十一章的记账原则固化成可直接粘贴给任何对话式 AI（或蓝鲸记账内置助手）的指令。原则：AI 管分类与汇总、不替你评价消费；你的账单数据只给可信工具。",
note:"用法：复制一条 prompt 粘贴给你的 AI 助手，之后把当月收支逐条发过去即可。隐私：只发送必要金额与类别，不含卡号等敏感信息。",
use:"适用",copy:"复制",copied:"已复制 ✓",foot:"来源：第三十一章（AI 记账）。书 → 工具系列（B1），蓝鲸记账配套。教学内容，不构成财务或隐私法律建议。"},
en:{title:"AI Accounting Prompt Pack",subtitle:"from Chapter 31 · companion to BlueWhale Ledger",
intro:"Turn Ch31's bookkeeping principles into ready-to-paste prompts for any conversational AI (or BlueWhale's built-in assistant). Principles: AI categorizes & summarizes, never judges your spending; only trusted tools see your ledger.",
note:"How to use: copy a prompt to your AI assistant, then feed it this month's transactions. Privacy: share only amounts and categories — no card numbers.",
use:"Use",copy:"Copy",copied:"Copied ✓",foot:"Source: Ch31 (AI bookkeeping). Book-to-tool series (B1), BlueWhale companion. Not financial or legal advice."}};
let LANG="zh";function t(k){return I18N[LANG][k]||I18N.zh[k];}
function toggleLang(){LANG=LANG==="zh"?"en":"zh";applyLang();}
function renderPacks(){
  document.getElementById("cards").innerHTML=PACKS.map((p,i)=>{
    const d=p[LANG]||p.zh;
    return `<div class="card"><h2>${d.t}</h2><div class="meta">${t("use")}：${d.use}</div>
    <div class="prompt" id="p${i}">${d.p.replace(/</g,"&lt;")}</div>
    <button class="copy" onclick="copyTxt(${i})">${t("copy")}</button><span class="ok" id="ok${i}">${t("copied")}</span></div>`;
  }).join("");
}
function applyLang(){
  document.documentElement.lang=LANG==="zh"?"zh-CN":"en";
  document.getElementById("langbtn").textContent=LANG==="zh"?"English":"中文";
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  renderPacks();document.getElementById("foot").innerHTML=t("foot");
}
function copyTxt(i){
  const txt=document.getElementById("p"+i).innerText;
  const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta);
  const ok=document.getElementById("ok"+i);ok.classList.add("show");setTimeout(()=>ok.classList.remove("show"),1600);
}
applyLang();
</script>
<script>
// Universal Web & Desktop Export + Toast
(function(){
  var b=document.createElement("button");
  b.className="export-fab-btn";
  b.innerHTML='<span style="margin-right:4px">📥</span>'+(window.LANG==="zh"?"导出结果 / Export":"Export");
  b.style.cssText="position:fixed;right:16px;bottom:14px;z-index:9999;border:none;border-radius:10px;background:#1D1E50;color:#fff;padding:9px 16px;font-size:13px;cursor:pointer;font-family:inherit;box-shadow:0 3px 12px rgba(29,30,80,0.25);transition:all .15s";
  b.onmouseenter=function(){b.style.transform="translateY(-1px)";b.style.boxShadow="0 5px 16px rgba(29,30,80,0.35)";};
  b.onmouseleave=function(){b.style.transform="none";b.style.boxShadow="0 3px 12px rgba(29,30,80,0.25)";};
  document.body.appendChild(b);

  function showToast(msg){
    var t=document.getElementById("tool-toast");
    if(!t){
      t=document.createElement("div");
      t.id="tool-toast";
      t.style.cssText="position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:10000;background:#1D1E50;color:#FFF;padding:8px 18px;border-radius:999px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,0.25);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap";
      document.body.appendChild(t);
    }
    t.textContent=msg;
    t.style.opacity="1";
    t.style.transform="translateX(-50%) translateY(0)";
    clearTimeout(t._timer);
    t._timer=setTimeout(function(){
      t.style.opacity="0";
      t.style.transform="translateX(-50%) translateY(6px)";
    },2400);
  }

  b.addEventListener("click",function(){
    var lines=[document.title,""];
    lines.push("--- INPUTS ---");
    document.querySelectorAll("input,select,textarea").forEach(function(inp){
      if(inp.type==="button"||inp.type==="submit") return;
      var lab=(inp.labels&&inp.labels[0])?inp.labels[0].textContent.trim()+" = ":"";
      if(!lab&&inp.id){var l=document.querySelector('label[for="'+inp.id+'"]');if(l)lab=l.textContent.trim()+" = ";}
      lines.push((lab||"")+inp.value);
    });
    lines.push("");lines.push("--- RESULT ---");
    document.querySelectorAll(".metric,.verdict,.diff,.big,.out,.res,#res,#output").forEach(function(el){
      var txt=el.textContent.trim().replace(/\s+/g," ");
      if(txt) lines.push(txt);
    });
    var content=lines.join("\n");
    var safeTitle=(document.title.split("·")[0]||document.title).trim().replace(/[^a-zA-Z0-9\u4e00-\u9fa5]+/g,"-").replace(/^-|-$/g,"")||"tool";
    var name=safeTitle+"-result.txt";

    if(window.__TAURI__){
      window.__TAURI__.core.invoke("export_result",{content:content,defaultName:name})
        .then(function(res){
          if(res!=="cancelled") showToast((window.LANG==="zh"?"已保存至: ":"Saved to: ")+res);
        })
        .catch(function(e){window.alert("Export failed: "+e);});
    }else{
      var blob=new Blob([content],{type:"text/plain;charset=utf-8"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      a.href=url;
      a.download=name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(window.LANG==="zh"?"已下载计算结果文本":"Result file downloaded");
    }
  });
})();
</script>
<script>
// LocalStorage Persistence + Reactive Input Calculation + Reset
(function(){
  if(typeof localStorage==="undefined") return;
  var KEY="ql-toolbox:"+location.pathname.replace(/[^a-z0-9]+/gi,"-");
  function getDefaults(){
    var o={};
    document.querySelectorAll("input,select,textarea").forEach(function(el){
      if(el.id && el.defaultValue!==undefined) o[el.id]=el.defaultValue;
    });
    return o;
  }
  var defaults=getDefaults();

  window.resetDefaults=function(){
    localStorage.removeItem(KEY);
    Object.keys(defaults).forEach(function(id){
      var el=document.getElementById(id);
      if(el) el.value=defaults[id];
    });
    var fn=window.calc||window.run||window.gen||null;
    if(fn) fn();
    var t=document.getElementById("tool-toast");
    if(t){
      t.textContent=window.LANG==="zh"?"已恢复默认参数":"Defaults restored";
      t.style.opacity="1";
      setTimeout(function(){t.style.opacity="0";},2000);
    }
  };

  function loadVals(){
    var raw=localStorage.getItem(KEY); if(!raw) return;
    try{ var o=JSON.parse(raw);
      Object.keys(o).forEach(function(id){ var el=document.getElementById(id); if(el) el.value=o[id]; });
      var fn=window.calc||window.run||window.gen||null; if(fn) fn();
    }catch(e){}
  }
  function saveVals(){ var o={};
    document.querySelectorAll("input,select,textarea").forEach(function(el){ if(el.id) o[el.id]=el.value; });
    try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){}
    var fn=window.calc||window.run||window.gen||null; if(fn) fn();
  }
  document.addEventListener("input",saveVals);
  document.addEventListener("change",saveVals);
  loadVals();
})();
</script>
