<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF 溢价率速算 · Premium Calculator</title>
<style>
  :root{--cream:#FBF7F0;--paper:#FFF;--pink:#FEC6CD;--pink-deep:#F3A6AF;--navy:#1D1E50;--bronze:#B86C40;--teal:#0F6E56;--ink:#2C2C2A;--line:#E7E0D4;--muted:#6b675e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.6;padding:24px 16px 40px}
  .wrap{max-width:960px;margin:0 auto}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  header h1{font-size:22px;font-weight:700;color:var(--navy)} header .sub{font-size:13px;color:var(--muted);flex:1}
  .langbtn{border:1px solid var(--pink-deep);background:#fff;color:var(--navy);font-size:12px;padding:4px 10px;border-radius:999px;cursor:pointer}
  .disclaimer{font-size:12px;color:var(--muted);margin:6px 0 16px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  .card h2{font-size:14px;color:var(--navy);margin-bottom:12px;font-weight:600}
  .grid{display:grid;grid-template-columns:340px 1fr;gap:16px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
  .field{margin-bottom:11px}.field label{display:block;font-size:13px;margin-bottom:3px}.field .hint{font-size:11px;color:var(--muted)}
  .field input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:15px}
  .btn{width:100%;padding:11px;border:none;border-radius:10px;background:var(--navy);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px}
  .out{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:8px}
  .metric{background:#FDF9F3;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .metric .k{font-size:12px;color:var(--muted)}.metric .v{font-size:20px;font-weight:700;color:var(--navy);margin-top:2px}
  .metric .v.bad{color:var(--bronze)}
  .verdict{background:#FDF6EE;border-left:4px solid var(--bronze);border-radius:8px;padding:10px 12px;font-size:13px;margin:10px 0}
  .warn{background:#FCEBEB;border-left:4px solid #A32D2D;border-radius:8px;padding:10px 12px;font-size:13px;margin:10px 0}
  table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:right}th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:500}
  .note{font-size:12px;color:var(--muted);margin-top:8px}
  footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
</style>
</head>
<body>
<div class="wrap">
<header><a class="back" href="../index.html" data-i18n="back" style="font-size:12.5px;color:var(--bronze);text-decoration:none;flex-shrink:0;white-space:nowrap;margin-right:6px">← 返回工具箱</a><h1 data-i18n="title">ETF 溢价率速算</h1><span class="sub" data-i18n="subtitle">源自《四倍做多认知，长期做多人生》第十五章</span><button class="langbtn" id="langbtn" onclick="toggleLang()">English</button></header>
<p class="disclaimer" data-i18n="disclaimer">输入任意两项即可换算。教学工具，不构成投资建议。</p>
<div class="grid">
  <div class="card">
    <h2 data-i18n="inTitle">输入</h2>
    <div class="field"><label data-i18n="lNav">基金净值 NAV（元）</label><input id="nav" type="number" min="0.0001" step="0.001" value="1.000"></div>
    <div class="field"><label data-i18n="lPrice">市场成交价（元）</label><input id="price" type="number" min="0.0001" step="0.001" value="1.200"></div>
    <div class="field"><label data-i18n="lAmt">拟投入金额（元）</label><input id="amt" type="number" min="0" step="1000" value="10000"></div>
    <button class="btn" onclick="run()" data-i18n="btnRun">计算</button>
    <div class="note" data-i18n="inNote">溢价率 =（市价 − 净值）÷ 净值。当市价高于净值即「溢价买入」。</div>
  </div>
  <div class="card">
    <h2 data-i18n="outTitle">结果</h2>
    <div class="out">
      <div class="metric"><div class="k" data-i18n="mPrem">溢价率</div><div class="v" id="v-prem">—</div></div>
      <div class="metric"><div class="k" data-i18n="mLoss">溢价回归后的实际亏损</div><div class="v bad" id="v-loss">—</div></div>
    </div>
    <div class="metric" style="margin-bottom:8px"><div class="k" data-i18n="mOver">为「值 X 元的篮子」多付</div><div class="v" id="v-over">—</div></div>
    <div class="verdict" id="verdict"></div>
    <div class="warn" id="warn" style="display:none"></div>
  </div>
</div>

<div class="card">
  <h2 data-i18n="tblTitle">速查表：溢价率 → 回归后的实际亏损</h2>
  <table id="tbl">
    <tr><th data-i18n="tPrem">买入时溢价率</th><th data-i18n="tLoss">溢价回归后的实际亏损</th><th data-i18n="tOver">每 1 万元篮子的多付金额</th></tr>
  </table>
  <div class="note" data-i18n="tblNote">亏损 = p ÷ (1+p)（亏损以你的买入成本为分母，而非净值）。高溢价常见于跨境 ETF、新发或涨停限购场景；买入前请对照此表。</div>
</div>

<footer><div id="foot"></div></footer>
</div>
<script>
const I18N={zh:{back:"← 返回工具箱",title:"ETF 溢价率速算",subtitle:"源自《四倍做多认知，长期做多人生》第十五章",
disclaimer:"输入净值与成交价即可换算。教学工具，不构成投资建议。",
inTitle:"输入",lNav:"基金净值 NAV（元）",lPrice:"市场成交价（元）",lAmt:"拟投入金额（元）",btnRun:"计算",
inNote:"溢价率 =（市价 − 净值）÷ 净值。当市价高于净值即「溢价买入」。",
outTitle:"结果",mPrem:"溢价率",mLoss:"溢价回归后的实际亏损",mOver:"为「值 X 元的篮子」多付",
okVerdict:"当前为平价或折价（市价 ≤ 净值）：不存在溢价回归的额外亏损。",
badVerdict:"当前为 {prem} 溢价。若溢价收窄到 0，你将损失约 {loss}——即使底层资产一分不涨不跌。",
warnText:"⚠️ 高溢价买入 = 一进场就处于亏损状态。跨境/新发 ETF 溢价常见，请先核对 IOPV 再下单。",
tblTitle:"速查表：溢价率 → 回归后的实际亏损",
tPrem:"买入时溢价率",tLoss:"溢价回归后的实际亏损",tOver:"每 1 万元篮子的多付金额",
tblNote:"亏损 = p ÷ (1+p)（亏损以你的买入成本为分母，而非净值）。高溢价常见于跨境 ETF、新发或涨停限购场景；买入前请对照此表。",
foot:"来源：《四倍做多认知，长期做多人生》第十五章（溢价率与折价率）+ 附录 D 速查表。书 → 工具系列（A3）。教学假设，不构成投资建议。"},
en:{back:"← Toolbox",title:"ETF Premium Calculator",subtitle:"from Chapter 15 of Quadruple Leverage",
disclaimer:"Enter NAV and market price. Teaching tool, not investment advice.",
inTitle:"Inputs",lNav:"Fund NAV (CNY)",lPrice:"Market price (CNY)",lAmt:"Amount to invest (CNY)",btnRun:"Calculate",
inNote:"Premium = (market price − NAV) ÷ NAV. Price above NAV means buying at a premium.",
outTitle:"Result",mPrem:"Premium rate",mLoss:"Actual loss if premium reverts",mOver:"Overpayment for a basket worth X",
okVerdict:"Currently at par or discount (price ≤ NAV): no extra loss from premium reversion.",
badVerdict:"Currently at {prem} premium. If the premium reverts to zero you lose about {loss} — even if the underlying assets don't move.",
warnText:"⚠️ Buying at a high premium means starting at a loss. Common for cross-border/new ETFs — check IOPV first.",
tblTitle:"Lookup: premium rate → actual loss after reversion",
tPrem:"Premium at buy",tLoss:"Actual loss after reversion",tOver:"Overpayment per ¥10k basket",
tblNote:"Loss = p ÷ (1+p) (denominator is your buy cost, not NAV). High premiums are common in cross-border, newly listed, or limit-up ETFs — check before buying.",
foot:"Source: Ch15 (ETF premium/discount) + Appendix D lookup of Quadruple Leverage. Book-to-tool series (A3). Hypothetical."}};
let LANG="zh";function t(k,v){let s=I18N[LANG][k]||I18N.zh[k];if(v)for(const x in v)s=s.replace("{"+x+"}",v[x]);return s;}
function fmt(n){return "¥"+Math.round(n).toLocaleString(LANG==="zh"?"zh-CN":"en-US");}
function pct(n){return (n*100).toFixed(2)+"%";}
function toggleLang(){LANG=LANG==="zh"?"en":"zh";applyLang();}
function applyLang(){document.documentElement.lang=LANG==="zh"?"zh-CN":"en";document.getElementById("langbtn").textContent=LANG==="zh"?"English":"中文";
document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
document.getElementById("foot").innerHTML=t("foot");buildTable();run();}
function buildTable(){
  const rows=[[0.005,0.5],[0.01,1],[0.02,2],[0.03,3],[0.05,5],[0.08,8],[0.10,10],[0.15,15],[0.20,20],[0.30,30]];
  let html="<tr><th>"+t("tPrem")+"</th><th>"+t("tLoss")+"</th><th>"+t("tOver")+"</th></tr>";
  for(const [p,p100] of rows){const loss=p/(1+p);html+=`<tr><td>${p100}%</td><td>≈ ${(loss*100).toFixed(2)}%</td><td>${fmt(10000*p)}</td></tr>`;}
  document.getElementById("tbl").innerHTML=html;
}
function run(){
  const nav=Math.max(1e-4,+document.getElementById("nav").value||1);
  const price=Math.max(1e-4,+document.getElementById("price").value||nav);
  const amt=Math.max(0,+document.getElementById("amt").value||0);
  const prem=(price-nav)/nav;
  const loss=prem>0? prem/(1+prem):0;
  const over=prem>0? amt*prem:0; // 多付=按净值应买份数×单价差
  document.getElementById("v-prem").textContent=pct(prem);
  document.getElementById("v-loss").textContent=loss>0?("≈ "+pct(loss)):"0";
  document.getElementById("v-over").textContent=over>0?fmt(over):"—";
  const vd=document.getElementById("verdict");
  if(prem>0){vd.innerHTML=t("badVerdict",{prem:pct(prem),loss:pct(loss)});document.getElementById("warn").style.display="block";
    document.getElementById("warn").innerHTML=prem>=0.02? t("warnText") : "";if(prem<0.02)document.getElementById("warn").style.display="none";}
  else{vd.innerHTML=t("okVerdict");document.getElementById("warn").style.display="none";}
}
applyLang();
</script>
</body>
</html>
