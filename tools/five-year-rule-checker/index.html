<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五年规则检查器 · Five-Year Rule Checker</title>
<style>
  :root{--cream:#FBF7F0;--paper:#FFF;--pink:#FEC6CD;--pink-deep:#F3A6AF;--navy:#1D1E50;--bronze:#B86C40;--teal:#0F6E56;--red:#A32D2D;--ink:#2C2C2A;--line:#E7E0D4;--muted:#6b675e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.6;padding:24px 16px 40px}
  .wrap{max-width:900px;margin:0 auto}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  header h1{font-size:22px;font-weight:700;color:var(--navy)} header .sub{font-size:13px;color:var(--muted);flex:1}
  .langbtn{border:1px solid var(--pink-deep);background:#fff;color:var(--navy);font-size:12px;padding:4px 10px;border-radius:999px;cursor:pointer}
  .disclaimer{font-size:12px;color:var(--muted);margin:6px 0 16px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  .card h2{font-size:14px;color:var(--navy);margin-bottom:12px;font-weight:600}
  .q{margin-bottom:12px}.q .ql{font-size:13px;margin-bottom:5px}
  .q select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
  .btn{width:100%;padding:11px;border:none;border-radius:10px;background:var(--navy);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
  th{color:var(--muted);font-weight:500}.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px}
  .tag.ok{background:#EAF3DE;color:#3B6D11}.tag.warn{background:#FAEEDA;color:#854F0B}.tag.bad{background:#FCEBEB;color:#A32D2D}
  .verdict{border-radius:8px;padding:12px 14px;font-size:13.5px;margin-top:12px}
  .verdict.ok{background:#EAF3DE;border-left:4px solid #639922}
  .verdict.warn{background:#FDF6EE;border-left:4px solid var(--bronze)}
  .verdict.bad{background:#FCEBEB;border-left:4px solid var(--red)}
  .note{font-size:12px;color:var(--muted);margin-top:10px}
  footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
</style>
</head>
<body>
<div class="wrap">
<header><a class="back" href="../index.html" data-i18n="back" style="font-size:12.5px;color:var(--bronze);text-decoration:none;flex-shrink:0;white-space:nowrap;margin-right:6px">← 返回工具箱</a><h1 data-i18n="title">五年规则检查器</h1><span class="sub" data-i18n="subtitle">源自《四倍做多认知，长期做多人生》第四章</span><button class="langbtn" id="langbtn" onclick="toggleLang()">English</button></header>
<p class="disclaimer" data-i18n="disclaimer">一句话规则：「五年内确定要用的钱，不适合投入高波动权益类资产。」教学工具，不构成投资建议。</p>
<div class="card">
  <h2 data-i18n="qTitle">这笔钱什么时候要用？</h2>
  <div class="q"><div class="ql" data-i18n="qTerm">计划动用时间</div>
    <select id="term" onchange="run()">
      <option value="1y" data-i18n="t1y">一年以内（如应急金、近期账单）</option>
      <option value="3y" data-i18n="t3y">一到三年（如学费、换车）</option>
      <option value="5y" data-i18n="t5y">三到五年（如换房首付准备）</option>
      <option value="5y+" data-i18n="t5p">五年以上 / 不确定（如退休金）</option>
    </select></div>
  <h2 data-i18n="qTitle2">它现在主要放在？</h2>
  <div class="q"><div class="ql" data-i18n="qWhere">当前资产类型</div>
    <select id="where" onchange="run()">
      <option value="dep" data-i18n="wDep">存款 / 货币基金 / 现金</option>
      <option value="bond" data-i18n="wBond">债券类 / 稳健固收</option>
      <option value="eq" data-i18n="wEq">股票 / 股票 ETF / 高波动权益</option>
      <option value="mix" data-i18n="wMix">混合型 / 不太确定</option>
    </select></div>
  <button class="btn" onclick="run()" data-i18n="btnRun">检查匹配度</button>
  <div id="verdict"></div>
</div>

<div class="card">
  <h2 data-i18n="tblTitle">期限 → 合适资产对照</h2>
  <table id="tbl">
    <tr><th data-i18n="hTerm">期限</th><th data-i18n="hFit">适合放的资产</th><th data-i18n="hAvoid">避免放的资产</th></tr>
  </table>
  <div class="note" data-i18n="note">期限匹配的底层逻辑：波动资产需要时间消化回撤；期限越短，越要牺牲收益换确定性。</div>
</div>
<footer><div id="foot"></div></footer>
</div>
<script>
const I18N={zh:{back:"← 返回工具箱",title:"五年规则检查器",subtitle:"源自《四倍做多认知，长期做多人生》第四章",disclaimer:"一句话规则：「五年内确定要用的钱，不适合投入高波动权益类资产。」教学工具，不构成投资建议。",
qTitle:"这笔钱什么时候要用？",qTerm:"计划动用时间",t1y:"一年以内（如应急金、近期账单）",t3y:"一到三年（如学费、换车）",t5y:"三到五年（如换房首付准备）",t5p:"五年以上 / 不确定（如退休金）",
qTitle2:"它现在主要放在？",qWhere:"当前资产类型",wDep:"存款 / 货币基金 / 现金",wBond:"债券类 / 稳健固收",wEq:"股票 / 股票 ETF / 高波动权益",wMix:"混合型 / 不太确定",btnRun:"检查匹配度",
vOkDep:"<b>匹配 ✔</b> 短期要用 + 低波动工具：正确组合，继续持有。",
vOkBond:"<b>基本匹配 ✔</b> 一到三年用钱放在债券类可以接受；期限更短的部分建议移入存款/货币基金。",
vWarnBond:"<b>偏保守 ⚠</b> 期限较长却放在债券/存款：安全但浪费了长期收益潜力；若资金确实五年以上不用，可考虑分批转入宽基权益。",
vBadEq:"<b>高风险错配 ✘</b> 「{term}要用」的钱放在高波动权益——若到点需要用钱时恰逢下跌，你被迫在低点卖出。请尽快把这部分转移到存款/货币基金（或对应期限的债券）。",
vMix:"<b>检查底层 ⚠</b> 混合型/不确定需看底层：若偏股且期限短，同高风险错配处理；若偏债则接近匹配。",
vOkMix:"<b>匹配 ✔</b> 长期或不确定的钱放在权益/混合里符合五年规则——你有时间消化波动。",
tblTitle:"期限 → 合适资产对照",hTerm:"期限",hFit:"适合放的资产",hAvoid:"避免放的资产",
note:"期限匹配的底层逻辑：波动资产需要时间消化回撤；期限越短，越要牺牲收益换确定性。",
foot:"来源：《四倍做多认知，长期做多人生》第四章（负债与应急资金/五年规则）。书 → 工具系列（A6）。教学参考，不构成投资建议。"},
en:{back:"← Toolbox",title:"Five-Year Rule Checker",subtitle:"from Chapter 4 of Quadruple Leverage",disclaimer:"Rule: money needed within five years does not belong in volatile equity. Teaching tool, not investment advice.",
qTitle:"When will this money be needed?",qTerm:"Time horizon",t1y:"Within 1 year (emergency, bills)",t3y:"1–3 years (tuition, car)",t5y:"3–5 years (home down payment)",t5p:"5+ years / uncertain (retirement)",
qTitle2:"Where is it now?",qWhere:"Current asset type",wDep:"Deposits / money-market / cash",wBond:"Bonds / stable fixed income",wEq:"Stocks / stock ETFs / volatile equity",wMix:"Mixed / not sure",btnRun:"Check fit",
vOkDep:"<b>Match ✔</b> Short-term money + low-volatility tool: correct combination, keep it.",
vOkBond:"<b>Mostly match ✔</b> Money needed in 1–3 years in bonds is acceptable; for the shortest part move to deposits/money-market.",
vWarnBond:"<b>Too conservative ⚠</b> Long horizon parked in bonds/cash: safe but wastes return potential; if truly 5+ years, consider rotating into broad equity in tranches.",
vBadEq:"<b>High-risk mismatch ✘</b> Money needed \"{term}\" sits in volatile equity — if a downturn coincides with your need, you'd sell at the bottom. Move it to deposits/money-market (or maturity-matched bonds) soon.",
vMix:"<b>Check the underlying ⚠</b> Mixed/unsure depends on holdings: equity-heavy + short horizon = treat as high-risk mismatch; bond-heavy ≈ match.",
vOkMix:"<b>Match ✔</b> Long/uncertain money in equity or mixed fits the five-year rule — you have time to ride volatility.",
tblTitle:"Horizon → suitable assets",hTerm:"Horizon",hFit:"Suitable",hAvoid:"Avoid",
note:"Why it works: volatile assets need time to recover drawdowns; the shorter the horizon, the more you trade return for certainty.",
foot:"Source: Ch4 (debt, emergency fund, five-year rule) of Quadruple Leverage. Book-to-tool series (A6). Teaching reference."}};
let LANG="zh";function t(k,v){let s=I18N[LANG][k]||I18N.zh[k];if(v)for(const x in v)s=s.replace("{"+x+"}",v[x]);return s;}
function toggleLang(){LANG=LANG==="zh"?"en":"zh";applyLang();}
function applyLang(){document.documentElement.lang=LANG==="zh"?"zh-CN":"en";document.getElementById("langbtn").textContent=LANG==="zh"?"English":"中文";
document.querySelectorAll("[data-i18n]").forEach(el=>{if(el.tagName!=="OPTION")el.textContent=t(el.dataset.i18n);});
buildTbl();run();document.getElementById("foot").innerHTML=t("foot");}
function buildTbl(){
  let html=`<tr><th>${t("hTerm")}</th><th>${t("hFit")}</th><th>${t("hAvoid")}</th></tr>`;
  html+=`<tr><td>${t("t1y")}</td><td>${t("wDep")}</td><td>${t("wEq")}</td></tr>`;
  html+=`<tr><td>${t("t3y")}</td><td>${t("wBond")} / ${t("wDep")}</td><td>${t("wEq")}</td></tr>`;
  html+=`<tr><td>${t("t5y")}</td><td>债券为主 + 少量权益</td><td>高波动权益高比例</td></tr>`;
  html+=`<tr><td>${t("t5p")}</td><td>宽基权益 + 债券组合</td><td>（无，长期可承受波动）</td></tr>`;
  document.getElementById("tbl").innerHTML=html;
}
function termText(){return document.getElementById("term").options[document.getElementById("term").selectedIndex].text;}
function run(){
  const term=document.getElementById("term").value, where=document.getElementById("where").value;
  const v=document.getElementById("verdict");v.className="verdict";v.style.display="block";
  const T={1y:t("t1y"),"3y":t("t3y"),"5y":t("t5y"),"5y+":t("t5p")}[term];
  if(term==="1y"){ if(where==="dep"){v.className+=" ok";v.innerHTML=t("vOkDep");}
    else if(where==="bond"){v.className+=" warn";v.innerHTML=t("vOkBond");}
    else {v.className+=" bad";v.innerHTML=t("vBadEq",{term:T});} }
  else if(term==="3y"){ if(where==="dep"||where==="bond"){v.className+=" ok";v.innerHTML=where==="bond"?t("vOkBond"):t("vOkDep");}
    else {v.className+=" bad";v.innerHTML=t("vBadEq",{term:T});} }
  else if(term==="5y"){ if(where==="bond"||where==="dep"){v.className+=" ok";v.innerHTML=t("vOkBond");}
    else if(where==="mix"){v.className+=" warn";v.innerHTML=t("vMix");}
    else {v.className+=" bad";v.innerHTML=t("vBadEq",{term:T});} }
  else { // 5y+
    if(where==="eq"||where==="mix"){v.className+=" ok";v.innerHTML=t("vOkMix");}
    else {v.className+=" warn";v.innerHTML=t("vWarnBond");} }
}
applyLang();
</script>
</body>
</html>
