<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="《四倍做多认知，长期做多人生》配套工具箱：复利、定投、溢价率、费率、配置建议、记账与复盘等 10 件双语小工具。Companion tools for the Quadruple Leverage book — bilingual, local-only.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1D1E50">
<meta property="og:title" content="四倍做多工具箱 · Quadruple Leverage Toolbox">
<meta property="og:description" content="《四倍做多认知，长期做多人生》配套工具箱：复利、定投、溢价率、费率、配置建议、记账与复盘等 10 件双语小工具。">
<meta property="og:type" content="website">
<title data-i18n="title">四倍做多工具箱 · Quadruple Leverage Toolbox</title>
<style>
  :root{--cream:#FBF7F0;--paper:#FFF;--pink:#FEC6CD;--pink-deep:#F3A6AF;--navy:#1D1E50;--bronze:#B86C40;--teal:#0F6E56;--ink:#2C2C2A;--line:#E7E0D4;--muted:#6b675e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.6;padding:28px 16px 48px}
  .wrap{max-width:960px;margin:0 auto}
  header{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  header .titles{flex:1;min-width:240px}
  header h1{font-size:24px;font-weight:700;color:var(--navy)}
  header .sub{font-size:13px;color:var(--muted);display:block}
  .langbtn{border:1px solid var(--pink-deep);background:#fff;color:var(--navy);font-size:12px;padding:5px 12px;border-radius:999px;cursor:pointer}
  .langbtn:hover{background:var(--pink)}
  .nav-home{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--bronze);text-decoration:none;background:#FDF2E6;border-radius:999px;padding:3px 12px;font-weight:600;margin-bottom:8px;transition:background .15s}
  .nav-home:hover{background:#fae5d0}

  .intro{font-size:13.5px;color:var(--ink);margin:8px 0 10px;max-width:82ch;background:#FFFDF7;border:1px solid var(--line);border-left:4px solid var(--pink-deep);border-radius:8px;padding:10px 14px}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .stat{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:12.5px;color:var(--muted)}
  .stat b{color:var(--navy)}
  .booklink{display:inline-block;font-size:12.5px;color:var(--bronze);margin:6px 0 2px;text-decoration:none;border-bottom:1px dashed var(--bronze)}
  .booklink:hover{border-bottom-style:solid}
  h2.sec{font-size:15px;color:var(--navy);margin:20px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--pink-deep);display:flex;align-items:center;gap:8px}
  h2.sec .cnt{font-size:11.5px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-weight:400}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  a.tile{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink);display:block;transition:border-color .15s,transform .15s}
  a.tile:hover{border-color:var(--pink-deep);transform:translateY(-1px)}
  .tile .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .tile .id{font-size:11px;font-weight:600;color:var(--bronze);letter-spacing:.5px;background:#FDF2E6;border-radius:999px;padding:1px 9px}
  .tile .open{font-size:11px;color:var(--muted);opacity:0;transition:opacity .15s}
  a.tile:hover .open{opacity:1}
  .tile .nm{font-size:15px;font-weight:600;color:var(--navy);margin:7px 0 3px}
  .tile .ds{font-size:12.5px;color:var(--muted)}
  .tile .ch{font-size:11.5px;color:var(--teal);margin-top:8px}
  footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:30px}
  footer a{color:var(--bronze)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titles">
      <a class="nav-home" href="../index.html"><span style="margin-right:4px">🏠</span><span data-i18n="backHome">返回图书主页</span></a>
      <h1 data-i18n="title">四倍做多工具箱</h1>
      <span class="sub" data-i18n="subtitle">书里公式，变成工具 · All run locally, nothing is uploaded</span>
    </div>
    <button class="langbtn" id="langbtn" onclick="toggleLang()" aria-label="Switch language / 切换语言">English</button>
  </header>

  <p class="intro" data-i18n="intro">《四倍做多认知，长期做多人生》的配套工具集：每一件都能在书中找到对应的公式与边界（卡片标注来源章节）。所有工具本地运行、不上传任何数据，适合分享给读者。</p>

  <div class="stats">
    <span class="stat" data-i18n="sTools">共 <b id="st-count">10</b> 件工具</span>
    <span class="stat" data-i18n="sLocal">100% 本地运行 · 无追踪</span>
    <span class="stat" data-i18n="sCh">覆盖章节：Ch4/5/15/16/22/27/28/31/32/33 + 附录 D/I/J</span>
  </div>

  <a class="booklink" id="booklink" href="../articles/2026-quadruple-long-life/README-zh_CN.md" data-i18n="booklink">→ 关于这本书（GitHub 仓库）</a>

  <h2 class="sec" data-i18n="secA">A · 数字工具箱<span class="cnt" id="cntA"></span></h2>
  <div class="grid" id="gridA"></div>

  <h2 class="sec" data-i18n="secB">B · AI 财务副驾驶<span class="cnt" id="cntB"></span></h2>
  <div class="grid" id="gridB"></div>

  <footer>
    <div id="foot"></div>
    <div style="margin-top:6px"><a id="roadlink" href="../TOOLBOX-ROADMAP.md" data-i18n="roadlink">完整产品路线图 TOOLBOX-ROADMAP.md →</a></div>
  </footer>
</div>
<script>
const TOOLS=[
 {id:"compound-calculator",grp:"A",n:1,ch:"Ch5 · Ch27",zh:{nm:"复利计算器",ds:"本金+定投+年化 → 终值、增长曲线与 72 法则；25 vs 35 岁对比"},en:{nm:"Compound Calculator",ds:"Principal + contributions + return → final value, growth curve, Rule of 72; age 25 vs 35"}},
 {id:"dca-simulator",grp:"A",n:2,ch:"Ch27",zh:{nm:"定投模拟器",ds:"一次性 vs 每月定投，微笑曲线（先跌后涨）里的低成本优势"},en:{nm:"DCA Simulator",ds:"Lump sum vs monthly DCA; the cost-averaging edge in a smile-curve dip"}},
 {id:"etf-premium-calculator",grp:"A",n:3,ch:"Ch15 · App.D",zh:{nm:"ETF 溢价率速算",ds:"市价/净值 → 溢价率、回归亏损与多付金额，附 10 档速查表"},en:{nm:"ETF Premium Calculator",ds:"Price/NAV → premium rate, reversion loss & overpayment; 10-step lookup"}},
 {id:"fee-erosion-calculator",grp:"A",n:4,ch:"Ch16",zh:{nm:"费率侵蚀对比器",ds:"两只基金的费率差，复利 N 年后的终值差距可视化"},en:{nm:"Fee Erosion Comparator",ds:"Visualize how a fee gap compounds into a value gap over N years"}},
 {id:"age-allocation-advisor",grp:"A",n:5,ch:"Ch22 · App.J",zh:{nm:"年龄配置建议器",ds:"年龄段 + 4 问 → 参考配置区间与「不适用情形」提示"},en:{nm:"Age Allocation Advisor",ds:"Age band + 4 questions → reference ranges & 'not applicable' caveats"}},
 {id:"five-year-rule-checker",grp:"A",n:6,ch:"Ch4",zh:{nm:"五年规则检查器",ds:"期限 × 当前资产 → 匹配度判定；五年内要用的钱别放高波动权益"},en:{nm:"Five-Year Rule Checker",ds:"Horizon × current asset → fit check; money needed in 5 yrs ≠ volatile equity"}},
 {id:"ai-accounting-pack",grp:"B",n:1,ch:"Ch31 · BlueWhale",zh:{nm:"AI 记账对话包",ds:"4 条可复制记账 prompt（分类/复盘/现金流/边界守护），蓝鲸记账配套"},en:{nm:"AI Accounting Prompt Pack",ds:"4 copy-ready bookkeeping prompts; companion to BlueWhale"}},
 {id:"goal-translator",grp:"B",n:2,ch:"Ch32",zh:{nm:"人生目标翻译器",ds:"把「想买房/教育/自由」翻译成每月该存多少"},en:{nm:"Life Goal Translator",ds:"Translate a home/education/freedom goal into a monthly saving number"}},
 {id:"review-generator",grp:"B",n:3,ch:"Ch28 · App.I",zh:{nm:"投资复盘生成器",ds:"几问生成结构化复盘草稿：纪律、收益、情绪、改进"},en:{nm:"Investment Review Generator",ds:"Answer a few questions → structured review: discipline, returns, emotions, next step"}},
 {id:"ai-redline-cards",grp:"B",n:4,ch:"Ch33",zh:{nm:"AI 投资红线卡",ds:"三条永不红线的可打印卡片，贴屏幕边上提醒自己"},en:{nm:"AI Investing Red-Line Cards",ds:"Three never-cross red lines on printable cards for your desk"}}
];
const I18N={zh:{title:"四倍做多工具箱 · Quadruple Leverage Toolbox",
subtitle:"书里公式，变成工具 · 全部本地运行、不上传数据",
backHome:"返回图书主页",
intro:"《四倍做多认知，长期做多人生》的配套工具集：每一件都能在书中找到对应的公式与边界（卡片标注来源章节）。所有工具本地运行、不上传任何数据，适合分享给读者。",
sTools:"共 {n} 件工具",sLocal:"100% 本地运行 · 无追踪",sCh:"覆盖：Ch4/5/15/16/22/27/28/31/32/33 + 附录 D/I/J",
booklink:"→ 关于这本书（GitHub 仓库）",secA:"A · 数字工具箱",secB:"B · AI 财务副驾驶",open:"打开 →",
foot:"工具来源章节见各卡片；内容为教学假设，不构成投资建议。仓库根 TOOLBOX-ROADMAP.md 记录了完整产品路线图（A/B 系列已交付，PR #26–36）。",
roadlink:"完整产品路线图 TOOLBOX-ROADMAP.md →"},
en:{title:"Quadruple Leverage Toolbox · 四倍做多工具箱",
subtitle:"Book formulas, turned into tools · All local, nothing uploaded",
backHome:"Back to Book Home",
intro:"Companion tools for 'Quadruple Leverage on Cognition, Long Life': every tool maps to a formula and its boundary in the book (chapter source on each card). All run locally, no data uploaded — share them with readers.",
sTools:"{n} tools",sLocal:"100% local · no tracking",sCh:"Covers: Ch4/5/15/16/22/27/28/31/32/33 + App.D/I/J",
booklink:"→ About the book (GitHub repo)",secA:"A · Numeric toolbox",secB:"B · AI co-pilot",open:"Open →",
foot:"Source chapters are on each card. All content is hypothetical teaching material, not investment advice. TOOLBOX-ROADMAP.md at repo root records the full product roadmap (A/B series delivered, PR #26–36).",
roadlink:"Full product roadmap TOOLBOX-ROADMAP.md →"}};
let LANG="zh";
function t(k,v){let s=I18N[LANG][k]||I18N.zh[k];if(v)for(const x in v)s=s.replace("{"+x+"}",v[x]);return s;}
function tz(o){return LANG==="zh"?o:o.en;}
function render(){
  const card=x=>`<a class="tile" href="${x.id}/index.html"><div class="row"><span class="id">${x.grp}${x.n}</span><span class="open">${t("open")}</span></div><div class="nm">${tz(x).nm}</div><div class="ds">${tz(x).ds}</div><div class="ch">${x.ch}</div></a>`;
  document.getElementById("gridA").innerHTML=TOOLS.filter(x=>x.grp==="A").map(card).join("");
  document.getElementById("gridB").innerHTML=TOOLS.filter(x=>x.grp==="B").map(card).join("");
  document.getElementById("cntA").textContent=TOOLS.filter(x=>x.grp==="A").length;
  document.getElementById("cntB").textContent=TOOLS.filter(x=>x.grp==="B").length;
  document.getElementById("st-count").textContent=TOOLS.length;
}
function toggleLang(){LANG=LANG==="zh"?"en":"zh";applyLang();}
function applyLang(){
  document.documentElement.lang=LANG==="zh"?"zh-CN":"en";
  document.getElementById("langbtn").textContent=LANG==="zh"?"English":"中文";
  document.title=t("title");
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  var isWeb = location.protocol === "http:" || location.protocol === "https:";
  var repoBase = "https://github.com/BerryUIKI/4i_e-acc";
  var bookFile = LANG === "zh" ? "articles/2026-quadruple-long-life/README-zh_CN.md" : "articles/2026-quadruple-long-life/README.md";
  document.getElementById("booklink").href = isWeb ? (repoBase + "/blob/main/" + bookFile) : ("../" + bookFile);
  document.getElementById("roadlink").href = isWeb ? (repoBase + "/blob/dev/TOOLBOX-ROADMAP.md") : "../TOOLBOX-ROADMAP.md";
  document.getElementById("st-count").textContent=TOOLS.length;
  render();
  document.getElementById("foot").innerHTML=t("foot");
  document.getElementById("roadlink").textContent=t("roadlink");
}

applyLang();
</script>
